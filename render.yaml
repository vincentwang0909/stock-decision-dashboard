services:
  - type: web
    name: stock-decision-dashboard
    runtime: python
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: gunicorn -c gunicorn.conf.py server:app
    healthCheckPath: /api/health
    disk:
      name: watchlist-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: WATCHLIST_DB_PATH
        value: /var/data/watchlist.db
      - key: DECISION_HISTORY_DB_PATH
        value: /var/data/历史记录.sqlite
      - key: EOD_DECISION_NODE_PATH
        value: node
      - key: EOD_HISTORY_NODE_MAX_OLD_SPACE_MB
        value: "128"
      - key: EOD_HISTORY_NODE_MAX_SEMI_SPACE_MB
        value: "4"
      - key: QUOTE_RAM_CACHE_MAX_BYTES
        value: "8388608"
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: NODE_VERSION
        value: "24.19.0"
      - key: RESOURCE_METRICS_ENABLED
        value: "true"
      - key: TECHNICAL_DAILY_HISTORY_PERIOD
        value: "10y"
      - key: TECHNICAL_FOUR_HOUR_HISTORY_PERIOD
        value: "365d"
      - key: MARKET_CACHE_DIR
        value: /var/data/cache
      - key: MARKET_DATA_MAX_TICKERS
        value: "60"
      - key: MARKET_DATA_MAX_LIVE_TICKERS
        value: "2"
      - key: MARKET_DATA_MAX_WORKERS
        value: "2"
      - key: MARKET_DATA_ROUTE_TIMEOUT_SECONDS
        value: "18"
