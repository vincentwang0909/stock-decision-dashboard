<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Decision Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=20260812-decision-engine-v1" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand"><div><h1 id="appTitle">Stock Decision Dashboard</h1></div></div>
        <div class="toolbar">
          <div class="lang-switch" role="tablist" aria-label="Language"><button class="lang-btn active" type="button" data-lang="en">English</button><button class="lang-btn" type="button" data-lang="zh">中文</button></div>
          <button id="manualRefreshButton" class="manual-refresh-btn" type="button">Refresh now</button>
        </div>
      </header>
      <main class="content">
        <section class="grid-card rail-card stock-picker-card">
          <div class="rail-head">
            <h2 id="stocksTitle">Stocks</h2>
            <p id="sharedWatchlistHint" class="shared-watchlist-hint">Shared Watchlist: everyone viewing this Dashboard sees the same stock list.</p>
            <p id="watchlistSyncWarning" class="watchlist-sync-warning" hidden>Shared list sync failed. Showing cached data.</p>
            <form id="watchlistForm" class="watchlist-form stock-picker-form">
              <label class="watchlist-input"><span id="tickerInputLabel">Search symbol or name</span><input id="tickerInput" type="text" placeholder="Search symbol or name" maxlength="48" autocomplete="off" /><div id="symbolSearchMenu" class="symbol-search-menu" hidden></div></label>
              <button id="addStockButton" type="submit" class="watchlist-submit" disabled>Add selected</button>
            </form>
            <div class="sort-rail" role="tablist" aria-label="Sort stocks">
              <button class="sort-btn" type="button" data-sort-key="ticker"><span id="sortTickerLabel">Ticker</span><span class="sort-indicator">↕</span></button>
              <button class="sort-btn" type="button" data-sort-key="type"><span id="sortTypeLabel">Stock type</span><span class="sort-indicator">↕</span></button>
              <button class="sort-btn" type="button" data-sort-key="change"><span id="sortChangeLabel">Day move</span><span class="sort-indicator">↕</span></button>
            </div>
            <div class="filter-rail" role="tablist" aria-label="Filter stocks"><button class="filter-btn active" type="button" data-market-filter="all">All</button><button class="filter-btn" type="button" data-market-filter="us">US</button><button class="filter-btn" type="button" data-market-filter="megaCap">Mega Cap</button><button class="filter-btn" type="button" data-market-filter="growth">Growth</button><button class="filter-btn" type="button" data-market-filter="speculative">Speculative</button><button class="filter-btn" type="button" data-market-filter="dividend">Dividend</button><button class="filter-btn" type="button" data-market-filter="value">Value</button></div>
          </div>
          <div id="stockList" class="stock-list" aria-label="Stocks in dashboard"></div>
        </section>
      </main>
    </div>
    <div id="detailModal" class="detail-modal" hidden><div class="detail-backdrop"></div><section class="detail-sheet" role="dialog" aria-modal="true"></section></div>
    <script src="./technical-features.js?v=20260809-canonical-v1"></script>
    <script src="./decision-engine/config.js?v=20260812-v1"></script>
    <script src="./decision-engine/technical-engine.js?v=20260812-v1"></script>
    <script src="./decision-engine/exhaustion-engine.js?v=20260812-v1"></script>
    <script src="./decision-engine/market-engine.js?v=20260812-v1"></script>
    <script src="./decision-engine/company-profile.js?v=20260812-v1"></script>
    <script src="./decision-engine/execution-engine.js?v=20260812-v1"></script>
    <script src="./decision-engine/confidence-engine.js?v=20260812-v1"></script>
    <script src="./decision-engine/stability-engine.js?v=20260812-v1"></script>
    <script src="./decision-engine/decision-engine.js?v=20260812-v1"></script>
    <script src="./main.js?v=20260812-decision-engine-v1"></script>
  </body>
</html>
